<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#1f6f5c">
  <title>Log in · Portfolio Desk</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' rx='3' fill='%231f6f5c'/%3E%3Cpath d='M3 11l3-3 2 2 5-5' stroke='white' stroke-width='1.8' fill='none'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body class="login-page">
  <main>
    <form method="post" class="panel login-box" autocomplete="on">
      <h1>Portfolio Desk</h1>
      <p class="sub">Enter your dashboard password.</p>
      {% if error %}<p class="login-error" role="alert">{{ error }}</p>{% endif %}
      <label for="password">Password</label>
      <input id="password" name="password" type="password" autocomplete="current-password" required autofocus>
      <label class="remember"><input id="remember" name="remember" type="checkbox" checked> Keep me logged in on this device for 30 days</label>
      <button type="submit">Log in</button>
    </form>
  </main>
</body>
</html>
